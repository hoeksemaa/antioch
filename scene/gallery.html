<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Doorbell Bench: Gallery</title>
  </head>
  <body>
    <header class="top">
      <div class="top-inner">
        <div class="brand"><span class="mark"></span>Doorbell Bench</div>
        <nav>
          <a href="./">Simulation</a>
          <a href="./benchmarks.html">Benchmark</a>
          <a class="on" href="./gallery.html">Gallery</a>
          <a href="https://github.com/hoeksemaa/antioch" target="_blank" rel="noopener">View source</a>
          <a href="https://johnhoeksema.com" target="_blank" rel="noopener">View creator</a>
        </nav>
      </div>
    </header>
    <div class="hatch"><div class="rail"></div></div>
    <main class="rail section">
      <section class="card detail" id="replay">
        <div class="card-head">
          <div class="scene-pick">
            <button id="scene-prev" title="Previous scene">‹</button>
            <select id="scene" aria-label="Scene"></select>
            <button id="scene-next" title="Next scene">›</button>
          </div>
        </div>
        <div class="detail-body">
          <div class="viewer">
            <div class="viewport" id="viewport"><div id="boxes"></div></div>
            <div class="timeline">
              <div class="controls">
                <button id="prev" title="Previous frame (←)">‹</button>
                <button id="play" title="Play or pause (space)">▶</button>
                <button id="next" title="Next frame (→)">›</button>
                <span class="mono" id="frame-info"></span>
              </div>
              <div class="strips-wrap">
                <div id="strips"></div>
                <div class="playhead" id="playhead"></div>
              </div>
              <div class="legend mono">
                <span><i class="hit"></i>hit</span>
                <span><i class="miss"></i>miss</span>
                <span><i class="out"></i>out of view</span>
                <span><i class="fa"></i>false alarm (no person)</span>
                <span><i class="truth"></i>true box</span>
                <span><i class="det"></i>detection</span>
              </div>
            </div>
          </div>
        </div>
      </section>
      <div class="shots" id="shots"></div>
    </main>
    <p class="credit">Unofficial demo.<br />Not affiliated<br />with Antioch.</p>
    <script type="module" src="/src/gallery.ts"></script>
  </body>
</html>
